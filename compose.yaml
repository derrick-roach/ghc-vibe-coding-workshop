services:
  contoso-backend:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: contoso-backend
    ports:
      - "8080:8080"
    environment:
      - CODESPACE_NAME=${CODESPACE_NAME}
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}
    networks:
      - contoso

  contoso-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
    container_name: contoso-frontend
    ports:
      - "3030:8080"
    environment:
      - ApiBaseUrl=http://contoso-backend:8080/api
    depends_on:
      - contoso-backend
    networks:
      - contoso

networks:
  contoso:
    driver: bridge
